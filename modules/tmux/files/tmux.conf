# AMR host tmux config — appended to ~/.tmux.conf by setup.sh.
# Applies to all host tmuxinator sessions (amr launch / launch-harvest / nav).

# Mouse: select panes, drag-resize borders, scroll for scrollback.
set -g mouse on

# Larger scrollback so long ROS logs stay reachable.
set -g history-limit 50000

# Tokyo Night theme; absent on AMR hosts, -q keeps that silent.
source-file -q ~/.config/tmux/tokyonight.conf
