# yazi 26.x. Only overrides; everything else is the preset. No theme.toml: the
# preset theme uses ANSI colour names, so it already follows the rice palette.
#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio       = [1, 3, 4]       # wider preview pane
show_hidden = true            # dotfiles matter in ROS workspaces (.envrc, .colcon)
linemode    = "size"          # file size in the right column
scrolloff   = 8

[preview]
wrap      = "no"
tab_size  = 4
max_width  = 1200             # bigger image previews
max_height = 1600

# Markdown: glow renders it with highlighted fenced code blocks. piper runs the
# command and shows its ANSI output; CLICOLOR_FORCE keeps colour on through the pipe.
[plugin]
prepend_previewers = [
    { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
]
