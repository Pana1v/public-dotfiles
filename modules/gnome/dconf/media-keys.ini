[/]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openwhispr-agent/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openwhispr-voice-agent/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/openwhispr/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/rofi-copilot/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/rofi/']
email=['<Super>e']
home=['<Super>f']
rotate-video-lock-static=@as []
screensaver=['<Super>Escape']
terminal=['<Control><Alt>t']
www=['<Super>b']

[custom-keybindings/openwhispr-agent]
binding='<Control>i'
command='dbus-send --session --type=method_call --dest=com.openwhispr.App /com/openwhispr/App com.openwhispr.App.ToggleAgent'
name='OpenWhispr Agent'

[custom-keybindings/openwhispr-voice-agent]
binding='<Control><Alt>space'
command='dbus-send --session --type=method_call --dest=com.openwhispr.App /com/openwhispr/App com.openwhispr.App.ToggleVoiceAgent'
name='OpenWhispr Voice Agent'

[custom-keybindings/openwhispr]
binding='<Control>space'
command='dbus-send --session --type=method_call --dest=com.openwhispr.App /com/openwhispr/App com.openwhispr.App.Toggle'
name='OpenWhispr Toggle'

[custom-keybindings/rofi-copilot]
binding='<Shift><Super>XF86TouchpadOff'
command='env -u WAYLAND_DISPLAY rofi -show drun -normal-window'
name='Rofi launcher (Copilot key)'

[custom-keybindings/rofi]
binding='<Super>r'
command='env -u WAYLAND_DISPLAY rofi -show drun -normal-window'
name='Rofi launcher'

[custom-keybindings/screencap0]
binding='<Super><Shift>r'
command='@HOME@/.local/bin/screencap --toggle'
name='Screencap: record'

[custom-keybindings/screencap1]
binding='<Super><Shift>a'
command='@HOME@/.local/bin/screencap --area'
name='Screencap: record an area'

[custom-keybindings/screencap2]
binding='<Super><Shift>s'
command='@HOME@/.local/bin/screencap --shot-area'
name='Screencap: screenshot an area'

[custom-keybindings/screencap3]
binding='Print'
command='@HOME@/.local/bin/screencap --shot'
name='Screencap: screenshot'
