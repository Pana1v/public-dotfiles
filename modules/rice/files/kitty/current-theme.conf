# Rice palette: switch-theme.sh swaps these hexes for the active theme.
# Opaque window, square look, no brackets (kitty cannot draw them).
font_family             JetBrains Mono
font_size               11
window_padding_width    12
cursor_shape            block
cursor_blink_interval   0
tab_bar_style           separator
tab_separator           " | "

foreground              #ffe9e9
background              #0a0303
selection_foreground    #ffe9e9
selection_background    #4a0f12
cursor                  #ffe9e9
cursor_text_color       #0a0303
url_color               #b00008
active_border_color     #d10a10
inactive_border_color   #2a0c0e
bell_border_color       #ffb84a
active_tab_foreground   #060101
active_tab_background   #d10a10
inactive_tab_foreground #7d1c20
inactive_tab_background #2a0c0e
tab_bar_background      #020000

color0  #020000
color8  #641418
color1  #ff1a1a
color9  #ff1a1a
color2  #ff7070
color10 #ff7070
color3  #ffb84a
color11 #ffb84a
color4  #d10a10
color12 #d10a10
color5  #ff3d6b
color13 #ff3d6b
color6  #ff3b3b
color14 #ff3b3b
color7  #f5c6c6
color15 #ffe9e9
