# Rice palette: switch-theme.sh swaps these hexes for the active theme.
# Opaque window, square look, no brackets (kitty cannot draw them).
font_family             JetBrains Mono
font_size               11
window_padding_width    12
cursor_shape            block
cursor_blink_interval   0
tab_bar_style           separator
tab_separator           " | "

foreground              #f5f5f5
background              #0a0303
selection_foreground    #f5f5f5
selection_background    #4a0f12
cursor                  #f5f5f5
cursor_text_color       #0a0303
url_color               #b00008
active_border_color     #ec0b12
inactive_border_color   #2a0c0e
bell_border_color       #ffb84a
active_tab_foreground   #060101
active_tab_background   #ec0b12
inactive_tab_foreground #969696
inactive_tab_background #2a0c0e
tab_bar_background      #020000

color0  #020000
color8  #af232a
color1  #ff1a1a
color9  #ff1a1a
color2  #e8e8e8
color10 #e8e8e8
color3  #ffb84a
color11 #ffb84a
color4  #ec0b12
color12 #ec0b12
color5  #ff3d6b
color13 #ff3d6b
color6  #ff3b3b
color14 #ff3b3b
color7  #d4d4d4
color15 #f5f5f5
