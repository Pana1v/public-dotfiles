# Mono rice, greyscale with state colours (see rice/themes/mono.palette)
# Opaque window, square look, no brackets (kitty cannot draw them).
font_family             JetBrains Mono
font_size               11
window_padding_width    12
cursor_shape            block
cursor_blink_interval   0
tab_bar_style           separator
tab_separator           " | "

foreground              #ffe9eb
background              #0a0506
selection_foreground    #ffe9eb
selection_background    #4a161b
cursor                  #ffe9eb
cursor_text_color       #0a0506
url_color               #e0283f
active_border_color     #ff1f3d
inactive_border_color   #2a1013
bell_border_color       #ffc14d
active_tab_foreground   #050203
active_tab_background   #ff1f3d
inactive_tab_foreground #73303a
inactive_tab_background #2a1013
tab_bar_background      #020101

