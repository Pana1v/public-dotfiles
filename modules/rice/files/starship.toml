# Mono prompt, greyscale with state colours. Glyphs come from Symbols Nerd Font (fonts-cursors module).
"$schema" = 'https://starship.rs/config-schema.json'

format = "$character"

[directory]
style = "fg:#060101 bg:#d10a10"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#2a0c0e"
format = '[[ $symbol $branch ](fg:#d10a10 bg:#2a0c0e)]($style)'

[git_status]
style = "bg:#2a0c0e"
format = '[[($all_status$ahead_behind )](fg:#d10a10 bg:#2a0c0e)]($style)'

[python]
symbol = ""
style = "bg:#120506"
format = '[[ $symbol ($version) (\($virtualenv\)) ](fg:#f5c6c6 bg:#120506)]($style)'

[cmd_duration]
min_time = 2000
style = "bg:#120506"
format = '[[  $duration ](fg:#ffb84a bg:#120506)]($style)'

[character]
success_symbol = "[❯](bold #ff3d6b)"
error_symbol = "[❯](bold #ff1a1a)"
