# Tokyo Night status bar. Sourced from ~/.tmux.conf on rice'd machines only.
set -g status-position top
set -g status-style "bg=#050203,fg=#f2c4c8"
set -g status-left-length 30
set -g status-left "#[fg=#050203,bg=#ff1f3d,bold] #S #[fg=#ff1f3d,bg=#050203]"
set -g status-right "#[fg=#2a1013]#[fg=#f2c4c8,bg=#2a1013] %H:%M #[fg=#ff4f8b]#[fg=#050203,bg=#ff4f8b,bold] #h "
set -g window-status-format "#[fg=#8a3a44] #I #W "
set -g window-status-current-format "#[fg=#050203,bg=#ff6b7d]#[fg=#050203,bg=#ff6b7d,bold] #I #W #[fg=#ff6b7d,bg=#050203]"
set -g window-status-separator ""
set -g pane-border-style "fg=#2a1013"
set -g pane-active-border-style "fg=#ff1f3d"
set -g message-style "bg=#2a1013,fg=#ff6b7d"
set -g mode-style "bg=#4a161b,fg=#ffe9eb"
