# Tokyo Night status bar. Sourced from ~/.tmux.conf on rice'd machines only.
set -g status-position top
set -g status-style "bg=#060101,fg=#f5c6c6"
set -g status-left-length 30
set -g status-left "#[fg=#060101,bg=#d10a10,bold] #S #[fg=#d10a10,bg=#060101]"
set -g status-right "#[fg=#2a0c0e]#[fg=#f5c6c6,bg=#2a0c0e] %H:%M #[fg=#ff3d6b]#[fg=#060101,bg=#ff3d6b,bold] #h "
set -g window-status-format "#[fg=#9e2228] #I #W "
set -g window-status-current-format "#[fg=#060101,bg=#ff3b3b]#[fg=#060101,bg=#ff3b3b,bold] #I #W #[fg=#ff3b3b,bg=#060101]"
set -g window-status-separator ""
set -g pane-border-style "fg=#2a0c0e"
set -g pane-active-border-style "fg=#d10a10"
set -g message-style "bg=#2a0c0e,fg=#ff3b3b"
set -g mode-style "bg=#4a0f12,fg=#ffe9e9"
