    background    = false,
    double_buffer = true,
    draw_shades   = false,
    draw_borders  = false,
    draw_outline  = false,

    -- Text (unused — all drawing done in Lua)
    use_xft       = true,
    font          = 'Roboto:size=1',
    out_to_x      = true,
    extra_newline = false,
}

